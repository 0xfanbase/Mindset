<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mindset</title>
<meta name="description" content="A daily journal prompt and a life-in-weeks chart, every morning at 05:00 HKT.">
<meta property="og:title" content="Mindset">
<meta property="og:description" content="A daily journal prompt and a life-in-weeks chart, every morning at 05:00 HKT.">
<meta property="og:type" content="website">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF4F6">
<script>
(function () {
  try {
    var h = Number(new Intl.DateTimeFormat("en-GB", {
      timeZone: "Asia/Hong_Kong", hour: "2-digit", hour12: false
    }).format(new Date()));
    var dark = (h < 6 || h >= 17);
    var root = document.documentElement;
    root.setAttribute("data-theme", dark ? "dark" : "blossom");
    root.style.colorScheme = dark ? "dark" : "light";
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", dark ? "#242119" : "#FBF4F6");
    localStorage.removeItem("mindset.theme");
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header>
  <div class="brand">
    <div class="wordmark">mindset</div>
    <div id="date-line" class="date-line"></div>
  </div>
  <div class="figure-wrap">
    <mindset-figure id="figure" aria-hidden="true"></mindset-figure>
  </div>
  <button id="theme-toggle" class="theme-toggle" aria-label="Switch to dark theme" title="Switch to dark theme"></button>
</header>
<main>
  <div id="staleness-chip" class="chip" hidden></div>
  <div class="mindset-panel">
    <div id="cards"></div>
    <div class="seam" aria-hidden="true"><div class="seam-pill" id="weeks-total-pill"></div></div>
    <div id="weeks-root" role="region" aria-label="Life in weeks"></div>
  </div>
</main>
<footer>
  <div>refreshes daily &middot; 05:00 HKT</div>
</footer>
<script type="module" src="./figure.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
